<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>لوحة تحكم TLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  html { overflow-x: hidden; }
  body { font-family: 'Cairo', sans-serif; background: #f4f6fb; color: #0e2c5c; }
  .btn { display:inline-flex; align-items:center; gap:.4rem; border-radius:.6rem; font-weight:700; transition:all .15s; cursor:pointer; }
  .btn-gold { background: linear-gradient(135deg,#e3c04a,#c9a227); color:#0e2c5c; }
  .btn-gold:hover { filter:brightness(1.05); }
  .btn-navy { background:#0e2c5c; color:#fff; }
  .btn-navy:hover { background:#163a73; }
  .btn-ghost { background:#fff; color:#0e2c5c; border:1px solid #d7deec; }
  .btn-ghost:hover { background:#eef2fb; }
  .btn-danger { background:#fdecec; color:#b91c1c; border:1px solid #f6c9c9; }
  .btn-danger:hover { background:#fbdada; }
  .field { width:100%; padding:.6rem .8rem; border:1px solid #d7deec; border-radius:.6rem; font-size:.9rem; background:#fff; }
  .field:focus { outline:none; border-color:#c9a227; box-shadow:0 0 0 3px rgba(201,162,39,.15); }
  table { border-collapse: collapse; }
  .tab-active { background:#0e2c5c; color:#fff; box-shadow:0 4px 12px -4px rgba(14,44,92,.5); }
  .lbl { display:block; font-size:.75rem; font-weight:700; margin-bottom:.25rem; }
  .stat { background:#fff; border:1px solid #e3e8f2; border-radius:1rem; box-shadow:0 1px 3px rgba(14,44,92,.05); }
  #regTbody tr:nth-child(even) { background:#fafbfe; }
  #regTbody tr:hover { background:#f1f5ff; }
  thead th:first-child { border-top-right-radius:.75rem; }
  thead th:last-child { border-top-left-radius:.75rem; }
</style>
</head>
<body class="min-h-screen">

<!-- ============ LOGIN ============ -->
<div id="loginView" class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg border border-[#e3e8f2] p-8">
    <div class="text-center mb-6">
      <img src="assets/logo.png" alt="TLC" class="h-20 w-auto mx-auto mb-4"/>
      <h1 class="text-xl font-extrabold">لوحة تحكم TLC</h1>
      <p class="text-sm text-slate-500 mt-1">سجّل الدخول للمتابعة</p>
    </div>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="lbl">اسم المستخدم</label>
        <input id="loginEmail" type="text" dir="ltr" class="field text-left" required placeholder="admin" autocomplete="username"/>
      </div>
      <div>
        <label class="lbl">كلمة المرور</label>
        <input id="loginPassword" type="password" dir="ltr" class="field text-left" required placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <p id="loginError" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></p>
      <button type="submit" class="btn btn-gold w-full justify-center py-3">دخول</button>
    </form>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="dashView" class="hidden">
  <!-- Top bar with centered logo -->
  <header class="bg-white border-b border-[#e3e8f2] shadow-sm sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 grid grid-cols-3 items-center py-3">
      <div class="flex justify-start"><span id="userEmail" class="text-xs text-slate-500 hidden sm:inline"></span></div>
      <div class="flex justify-center"><img src="assets/logo.png" alt="TLC" class="h-20 w-auto"/></div>
      <div class="flex justify-end"><button id="logoutBtn" class="btn btn-ghost px-3 py-2 text-sm"><span class="material-icons-outlined text-base">logout</span><span class="hidden sm:inline">خروج</span></button></div>
    </div>
    <!-- Tabs -->
    <div class="max-w-6xl mx-auto px-4 pb-3 flex gap-2 justify-center">
      <button data-tab="reg" class="tab btn px-5 py-2.5 text-sm tab-active"><span class="material-icons-outlined text-base">group</span>المسجّلون</button>
      <button data-tab="courses" class="tab btn btn-ghost px-5 py-2.5 text-sm"><span class="material-icons-outlined text-base">menu_book</span>الكورسات</button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">

    <!-- ===== REGISTRATIONS ===== -->
    <section id="regSection">
      <!-- Stat tiles -->
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6">
        <div class="stat p-4 flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-[#eef2fb] text-[#0e2c5c] flex items-center justify-center"><span class="material-icons-outlined">group</span></div>
          <div><div class="text-2xl font-extrabold leading-none" id="statTotal">0</div><div class="text-xs text-slate-500 mt-1">إجمالي المسجّلين</div></div>
        </div>
        <div class="stat p-4 flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-[#fbf3d8] text-[#c9a227] flex items-center justify-center"><span class="material-icons-outlined">mark_email_read</span></div>
          <div><div class="text-2xl font-extrabold leading-none" id="statNews">0</div><div class="text-xs text-slate-500 mt-1">مشتركو النشرة</div></div>
        </div>
        <div class="stat p-4 flex items-center gap-3 col-span-2 sm:col-span-1">
          <div class="w-11 h-11 rounded-xl bg-[#e9f6ee] text-[#1f9254] flex items-center justify-center"><span class="material-icons-outlined">menu_book</span></div>
          <div><div class="text-2xl font-extrabold leading-none" id="statCourses">0</div><div class="text-xs text-slate-500 mt-1">عدد الكورسات</div></div>
        </div>
      </div>
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 class="text-lg font-extrabold">المسجّلون <span id="regCount" class="text-sm font-normal text-slate-500"></span></h2>
        <div class="flex items-center gap-2">
          <input id="regSearch" class="field w-48" placeholder="بحث بالاسم/الإيميل/الهاتف"/>
          <button id="refreshReg" class="btn btn-ghost px-3 py-2 text-sm"><span class="material-icons-outlined text-base">refresh</span></button>
          <button id="exportBtn" class="btn btn-navy px-4 py-2 text-sm"><span class="material-icons-outlined text-base">download</span>تصدير Excel</button>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-[#e3e8f2] overflow-x-auto shadow-sm">
        <table class="w-full text-sm whitespace-nowrap">
          <thead class="bg-[#f1f4fb] text-slate-600 text-right">
            <tr>
              <th class="px-3 py-3 font-bold">التاريخ</th>
              <th class="px-3 py-3 font-bold">الاسم</th>
              <th class="px-3 py-3 font-bold">البريد</th>
              <th class="px-3 py-3 font-bold">الهاتف</th>
              <th class="px-3 py-3 font-bold">الدولة</th>
              <th class="px-3 py-3 font-bold">المدينة</th>
              <th class="px-3 py-3 font-bold">الكورس</th>
              <th class="px-3 py-3 font-bold">النشرة</th>
              <th class="px-3 py-3 font-bold"></th>
            </tr>
          </thead>
          <tbody id="regTbody"></tbody>
        </table>
        <div id="regEmpty" class="hidden text-center text-slate-400 py-10">لا يوجد مسجّلون بعد.</div>
      </div>
    </section>

    <!-- ===== COURSES ===== -->
    <section id="coursesSection" class="hidden">

      <!-- List view -->
      <div id="coursesListView">
        <div class="flex items-center justify-between gap-3 mb-4">
          <h2 class="text-lg font-extrabold">إدارة الكورسات</h2>
          <button id="addCourseBtn" class="btn btn-gold px-4 py-2 text-sm"><span class="material-icons-outlined text-base">add</span>كورس جديد</button>
        </div>
        <div id="coursesList" class="space-y-3"></div>
      </div>

      <!-- Edit view -->
      <div id="courseEditView" class="hidden">
        <button id="backToCourses" class="btn btn-ghost px-3 py-2 text-sm mb-4"><span class="material-icons-outlined text-base">arrow_forward</span>رجوع للقائمة</button>
        <div class="bg-white rounded-xl border border-[#e3e8f2] shadow-sm p-5 max-w-2xl">
          <h2 id="editTitle" class="text-lg font-extrabold mb-4">تعديل الكورس</h2>
          <form id="courseForm" class="space-y-4" data-id="">
            <div>
              <label class="lbl">عنوان الكورس</label>
              <input class="field c-title" required/>
            </div>
            <div id="slugRow" class="hidden">
              <label class="lbl">المعرّف (slug بالإنجليزية، بدون مسافات)</label>
              <input class="field c-slug" dir="ltr" placeholder="my-course"/>
            </div>
            <div>
              <label class="lbl">المستوى (الشارة)</label>
              <input class="field c-level" placeholder="مبتدئ / عملي / شامل"/>
            </div>
            <div>
              <label class="lbl">الوصف</label>
              <textarea class="field c-desc" rows="3"></textarea>
            </div>
            <div>
              <label class="lbl">صورة الكورس</label>
              <div class="flex items-center gap-3">
                <img class="c-preview w-20 h-20 rounded-lg object-cover border border-[#d7deec] bg-[#f1f4fb]" src="" onerror="this.style.visibility='hidden'"/>
                <input type="hidden" class="c-image"/>
                <input type="file" accept="image/*" class="c-file hidden"/>
                <button type="button" class="btn btn-ghost px-3 py-2 text-sm" onclick="pickImage(this)"><span class="material-icons-outlined text-base">upload</span>اختر صورة من جهازك</button>
                <span class="c-upstatus text-xs text-slate-500"></span>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="lbl">الترتيب (الأصغر أولاً)</label>
                <input type="number" class="field c-order" value="0"/>
              </div>
              <div class="flex items-end gap-4">
                <label class="flex items-center gap-2 text-sm font-semibold"><input type="checkbox" class="c-visible w-4 h-4" checked/> ظاهر</label>
                <label class="flex items-center gap-2 text-sm font-semibold"><input type="checkbox" class="c-featured w-4 h-4"/> مميّز</label>
              </div>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t border-[#eef1f8]">
              <button type="button" class="btn btn-ghost px-4 py-2 text-sm" onclick="backToCourses()">إلغاء</button>
              <button type="submit" class="btn btn-navy px-5 py-2 text-sm">حفظ</button>
            </div>
          </form>
        </div>
      </div>

    </section>
  </main>
</div>

<!-- ===== Registration edit modal ===== -->
<div id="regModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" onclick="closeRegModal()"></div>
  <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
    <h3 class="text-lg font-extrabold mb-4">تعديل بيانات المسجّل</h3>
    <form id="regForm" class="space-y-3" data-id="">
      <div><label class="lbl">الاسم</label><input class="field r-name"/></div>
      <div><label class="lbl">البريد</label><input class="field r-email" dir="ltr"/></div>
      <div><label class="lbl">الهاتف</label><input class="field r-phone" dir="ltr"/></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="lbl">الدولة</label><input class="field r-country"/></div>
        <div><label class="lbl">المدينة</label><input class="field r-city"/></div>
      </div>
      <div><label class="lbl">الكورس</label><input class="field r-course"/></div>
      <label class="flex items-center gap-2 text-sm font-semibold"><input type="checkbox" class="r-news w-4 h-4"/> مشترك بالنشرة</label>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" class="btn btn-ghost px-4 py-2 text-sm" onclick="closeRegModal()">إلغاء</button>
        <button type="submit" class="btn btn-navy px-5 py-2 text-sm">حفظ</button>
      </div>
    </form>
  </div>
</div>

<script>
  // ---------- Supabase ----------
  const SUPA_URL = 'https://xuggbedyeapxaytzixps.supabase.co';
  const SUPA_KEY = 'sb_publishable_-9HtCsowbvRe9_Ro9JMKKQ_bAulNrnh';
  const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

  const $ = (id) => document.getElementById(id);
  const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let REGS = [], COURSES = [];

  // ---------- Auth ----------
  async function init() {
    const { data } = await sb.auth.getSession();
    if (data.session) showDash(data.session);
  }
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('loginError'); err.classList.add('hidden');
    const raw = $('loginEmail').value.trim();
    const email = raw.includes('@') ? raw : raw + '@tlc.local';
    const password = $('loginPassword').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { err.textContent = 'تعذّر الدخول: ' + error.message; err.classList.remove('hidden'); return; }
    showDash(data.session);
  });
  $('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    $('dashView').classList.add('hidden');
    $('loginView').classList.remove('hidden');
  });

  function showDash(session) {
    $('loginView').classList.add('hidden');
    $('dashView').classList.remove('hidden');
    $('userEmail').textContent = session.user.email;
    loadRegistrations();
    loadCourses();
  }

  // ---------- Tabs ----------
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => { x.classList.remove('tab-active'); x.classList.add('btn-ghost'); });
    t.classList.add('tab-active'); t.classList.remove('btn-ghost');
    const tab = t.dataset.tab;
    $('regSection').classList.toggle('hidden', tab !== 'reg');
    $('coursesSection').classList.toggle('hidden', tab !== 'courses');
    if (tab === 'courses') backToCourses();
  }));

  // ---------- Registrations ----------
  async function loadRegistrations() {
    const { data, error } = await sb.from('registrations').select('*').order('created_at', { ascending: false });
    if (error) { alert('خطأ في جلب المسجّلين: ' + error.message); return; }
    REGS = data || [];
    renderRegs();
  }
  function renderRegs() {
    $('statTotal').textContent = REGS.length;
    $('statNews').textContent = REGS.filter(r => r.newsletter_opt).length;
    const q = $('regSearch').value.trim().toLowerCase();
    const rows = REGS.filter(r => !q || [r.full_name, r.email, r.phone].some(v => (v||'').toLowerCase().includes(q)));
    $('regCount').textContent = '(' + rows.length + ')';
    $('regEmpty').classList.toggle('hidden', rows.length > 0);
    $('regTbody').innerHTML = rows.map(r => `
      <tr class="border-t border-[#eef1f8] hover:bg-[#f8faff]">
        <td class="px-3 py-2 text-slate-500">${esc(new Date(r.created_at).toLocaleString('ar-EG'))}</td>
        <td class="px-3 py-2 font-semibold">${esc(r.full_name)}</td>
        <td class="px-3 py-2" dir="ltr">${esc(r.email)}</td>
        <td class="px-3 py-2" dir="ltr">${esc(r.phone)}</td>
        <td class="px-3 py-2">${esc(r.country)}</td>
        <td class="px-3 py-2">${esc(r.city)}</td>
        <td class="px-3 py-2">${esc(r.course_title)}</td>
        <td class="px-3 py-2">${r.newsletter_opt ? '✔' : '—'}</td>
        <td class="px-3 py-2">
          <div class="flex gap-1">
            <button class="btn btn-ghost px-2 py-1 text-xs" onclick="editReg('${r.id}')"><span class="material-icons-outlined text-sm">edit</span></button>
            <button class="btn btn-danger px-2 py-1 text-xs" onclick="deleteReg('${r.id}')"><span class="material-icons-outlined text-sm">delete</span></button>
          </div>
        </td>
      </tr>`).join('');
  }
  $('regSearch').addEventListener('input', renderRegs);
  $('refreshReg').addEventListener('click', loadRegistrations);

  window.deleteReg = async function(id) {
    if (!confirm('هل أنت متأكد من حذف هذا التسجيل نهائياً؟')) return;
    const { error } = await sb.from('registrations').delete().eq('id', id);
    if (error) { alert('تعذّر الحذف: ' + error.message); return; }
    REGS = REGS.filter(r => r.id !== id);
    renderRegs();
  };

  window.editReg = function(id) {
    const r = REGS.find(x => x.id === id); if (!r) return;
    const f = $('regForm'); f.dataset.id = id;
    f.querySelector('.r-name').value = r.full_name || '';
    f.querySelector('.r-email').value = r.email || '';
    f.querySelector('.r-phone').value = r.phone || '';
    f.querySelector('.r-country').value = r.country || '';
    f.querySelector('.r-city').value = r.city || '';
    f.querySelector('.r-course').value = r.course_title || '';
    f.querySelector('.r-news').checked = !!r.newsletter_opt;
    $('regModal').classList.remove('hidden');
  };
  window.closeRegModal = () => $('regModal').classList.add('hidden');
  $('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = $('regForm'); const id = f.dataset.id;
    const payload = {
      full_name: f.querySelector('.r-name').value.trim(),
      email: f.querySelector('.r-email').value.trim(),
      phone: f.querySelector('.r-phone').value.trim(),
      country: f.querySelector('.r-country').value.trim(),
      city: f.querySelector('.r-city').value.trim(),
      course_title: f.querySelector('.r-course').value.trim(),
      newsletter_opt: f.querySelector('.r-news').checked
    };
    const { error } = await sb.from('registrations').update(payload).eq('id', id);
    if (error) { alert('تعذّر الحفظ: ' + error.message); return; }
    closeRegModal();
    loadRegistrations();
  });

  $('exportBtn').addEventListener('click', () => {
    if (!REGS.length) { alert('لا يوجد بيانات للتصدير.'); return; }
    const data = REGS.map(r => ({
      'التاريخ': new Date(r.created_at).toLocaleString('ar-EG'),
      'الاسم': r.full_name, 'البريد': r.email, 'الهاتف': r.phone,
      'الدولة': r.country, 'المدينة': r.city, 'الكورس': r.course_title,
      'النشرة': r.newsletter_opt ? 'نعم' : 'لا', 'المصدر': r.source
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المسجلون');
    XLSX.writeFile(wb, 'tlc-registrations-' + new Date().toISOString().slice(0,10) + '.xlsx');
  });

  // ---------- Courses: list ----------
  async function loadCourses() {
    const { data, error } = await sb.from('courses').select('*').order('sort_order', { ascending: true });
    if (error) { alert('خطأ في جلب الكورسات: ' + error.message); return; }
    COURSES = data || [];
    const sc = $('statCourses'); if (sc) sc.textContent = COURSES.length;
    renderCoursesList();
  }
  function renderCoursesList() {
    $('coursesList').innerHTML = COURSES.map(c => `
      <div class="bg-white rounded-xl border border-[#e3e8f2] shadow-sm p-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <img src="${esc(c.image_url)}" class="w-12 h-12 rounded-lg object-cover border border-[#d7deec] bg-[#f1f4fb] flex-shrink-0" onerror="this.style.visibility='hidden'"/>
          <div class="min-w-0">
            <div class="font-bold truncate">${esc(c.title)}</div>
            <div class="text-xs text-slate-500">
              ${c.level ? 'المستوى: ' + esc(c.level) + ' · ' : ''}ترتيب: ${c.sort_order ?? 0}
              ${c.is_visible === false ? ' · <span class="text-amber-600 font-bold">مخفي</span>' : ''}
              ${c.is_featured ? ' · <span class="text-[#c9a227] font-bold">مميّز</span>' : ''}
            </div>
          </div>
        </div>
        <div class="flex gap-2 flex-shrink-0">
          <button class="btn btn-ghost px-3 py-2 text-sm" onclick="editCourse('${c.id}')"><span class="material-icons-outlined text-base">edit</span>تعديل</button>
          <button class="btn btn-danger px-3 py-2 text-sm" onclick="deleteCourse('${c.id}')"><span class="material-icons-outlined text-base">delete</span>حذف</button>
        </div>
      </div>`).join('') || '<div class="text-center text-slate-400 py-10">لا توجد كورسات بعد.</div>';
  }

  // ---------- Courses: edit view ----------
  function openCourseForm(c) {
    const f = $('courseForm');
    const isNew = !c;
    f.dataset.id = isNew ? '' : c.id;
    $('editTitle').textContent = isNew ? 'إضافة كورس جديد' : 'تعديل الكورس';
    $('slugRow').classList.toggle('hidden', !isNew);
    f.querySelector('.c-title').value = isNew ? '' : (c.title || '');
    f.querySelector('.c-slug').value = '';
    f.querySelector('.c-level').value = isNew ? '' : (c.level || '');
    f.querySelector('.c-desc').value = isNew ? '' : (c.description || '');
    f.querySelector('.c-image').value = isNew ? '' : (c.image_url || '');
    f.querySelector('.c-order').value = isNew ? 0 : (c.sort_order ?? 0);
    f.querySelector('.c-visible').checked = isNew ? true : (c.is_visible !== false);
    f.querySelector('.c-featured').checked = isNew ? false : !!c.is_featured;
    const prev = f.querySelector('.c-preview');
    prev.src = f.querySelector('.c-image').value; prev.style.visibility = prev.src ? 'visible' : 'hidden';
    f.querySelector('.c-upstatus').textContent = '';
    $('coursesListView').classList.add('hidden');
    $('courseEditView').classList.remove('hidden');
    window.scrollTo(0, 0);
  }
  window.editCourse = function(id) {
    const c = COURSES.find(x => x.id === id); if (!c) return;
    openCourseForm(c);
  };
  window.backToCourses = function() {
    $('courseEditView').classList.add('hidden');
    $('coursesListView').classList.remove('hidden');
  };
  $('addCourseBtn').addEventListener('click', () => openCourseForm(null));
  $('backToCourses').addEventListener('click', backToCourses);

  $('courseForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = $('courseForm'); const id = f.dataset.id;
    const payload = {
      title: f.querySelector('.c-title').value.trim(),
      level: f.querySelector('.c-level').value.trim(),
      description: f.querySelector('.c-desc').value.trim(),
      image_url: f.querySelector('.c-image').value.trim(),
      sort_order: parseInt(f.querySelector('.c-order').value, 10) || 0,
      is_visible: f.querySelector('.c-visible').checked,
      is_featured: f.querySelector('.c-featured').checked
    };
    if (!payload.title) { alert('أدخل عنوان الكورس.'); return; }
    let error;
    if (id) {
      ({ error } = await sb.from('courses').update(payload).eq('id', id));
    } else {
      const slug = f.querySelector('.c-slug').value.trim();
      if (!slug) { alert('أدخل المعرّف (slug).'); return; }
      payload.slug = slug;
      ({ error } = await sb.from('courses').insert([payload]));
    }
    if (error) { alert('تعذّر الحفظ: ' + error.message); return; }
    await loadCourses();
    backToCourses();
  });

  window.deleteCourse = async function(id) {
    const c = COURSES.find(x => x.id === id);
    if (!confirm('هل أنت متأكد من حذف الكورس "' + (c ? c.title : '') + '" نهائياً؟')) return;
    const { error } = await sb.from('courses').delete().eq('id', id);
    if (error) { alert('تعذّر الحذف: ' + error.message); return; }
    await loadCourses();
  };

  // ---------- Image upload to Supabase Storage ----------
  window.pickImage = function(btn) {
    const scope = btn.closest('#courseForm') || document;
    const file = scope.querySelector('.c-file');
    file.onchange = () => uploadImage(scope, file.files[0]);
    file.click();
  };
  async function uploadImage(scope, f) {
    if (!f) return;
    const status = scope.querySelector('.c-upstatus');
    if (f.size > 5 * 1024 * 1024) { status.textContent = 'الحجم أكبر من 5MB'; return; }
    status.textContent = 'جارٍ الرفع…';
    const ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
    const path = 'course-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    const { error } = await sb.storage.from('course-images').upload(path, f, { cacheControl: '3600', upsert: false, contentType: f.type });
    if (error) { status.textContent = 'تعذّر الرفع'; alert('خطأ في الرفع: ' + error.message); return; }
    const { data } = sb.storage.from('course-images').getPublicUrl(path);
    scope.querySelector('.c-image').value = data.publicUrl;
    const prev = scope.querySelector('.c-preview');
    prev.src = data.publicUrl; prev.style.visibility = 'visible';
    status.textContent = 'تم الرفع ✓ (اضغط حفظ)';
  }

  init();
</script>
</body>
</html>
